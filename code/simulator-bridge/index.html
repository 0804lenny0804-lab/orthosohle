<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OrthoSohle ESP32-Simulator</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; color: #17212b; }
      h1 { margin-bottom: .25rem; }
      .note { color: #4b5965; }
      .status { min-height: 1.5rem; margin: 1.5rem 0 .5rem; }
      .reading { font-size: 3rem; font-weight: 700; margin: .25rem 0 1.25rem; }
      button { font: inherit; padding: .7rem 1rem; margin: 0 .5rem .5rem 0; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      #log { white-space: pre-wrap; max-height: 12rem; overflow: auto; background: #f2f5f7; padding: .75rem; }
    </style>
  </head>
  <body>
    <h1>ESP32-Simulator</h1>
    <p class="note">Synthetische Testwerte vom alten Simulator zum integrierten Display senden.</p>
    <p id="status" class="status" role="status">ESP32 nicht verbunden</p>
    <p id="reading" class="reading">— kg</p>
    <button id="connect">ESP32 verbinden</button>
    <button id="start" disabled>Simulation starten</button>
    <button id="stop" disabled>Simulation stoppen</button>
    <h2>Übertragung</h2>
    <pre id="log" aria-live="polite">Noch keine Werte gesendet.</pre>
    <script type="module" src="./app.js"></script>
  </body>
</html>
